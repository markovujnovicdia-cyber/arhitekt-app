# Render Blueprint: first deployment and secrets are approved in Render's UI.
services:
  - type: web
    name: arhitekt-office-ai
    runtime: docker
    branch: main
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DEVICE_ACCESS_TOKEN
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: TRANSCRIPTION_MODEL
        value: gpt-4o-transcribe
      - key: ANALYSIS_MODEL
        value: gpt-4.1-mini
      - key: PROVIDER_TIMEOUT_MS
        value: "120000"
